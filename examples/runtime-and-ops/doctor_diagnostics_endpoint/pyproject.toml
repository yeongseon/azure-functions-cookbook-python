[project]
name = "doctor-diagnostics-endpoint"
version = "0.1.0"
description = "HTTP endpoints that expose azure-functions-doctor diagnostics"
requires-python = ">=3.11"
dependencies = ["azure-functions", "azure-functions-doctor>=0.22.0"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
