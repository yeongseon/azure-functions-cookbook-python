[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = [
  "app",
  "tests",
  "function_app.py",
  "host.json",
  "local.settings.json.example",
  "README.md",
  "Makefile",
  "pyproject.toml",
]

[project]
name = "scaffold_walkthrough_app"
version = "0.1.0"
description = "Azure Functions Python v2 app scaffolded by azure-functions-scaffold."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "azure-functions>=1.23.0",
  "azure-functions-logging>=0.5.0",
  "orjson>=3.10.0",
"azure-functions-openapi>=0.17.0",
"azure-functions-validation>=0.11,<1",
"pydantic>=2.0.0",
"azure-functions-doctor>=0.16.0",
]

[project.optional-dependencies]
dev = [
"pytest>=8.3.5",
"ruff>=0.11.0",
"mypy>=1.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.mypy]
python_version = "3.10"
strict = true
pretty = true

