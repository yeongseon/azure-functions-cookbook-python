[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "durable_agent_approval"
version = "0.1.0"
description = "Durable Functions agent workflow with human approval, timeout and bounded work."
requires-python = ">=3.11"
dependencies = [
  "azure-functions>=1.22.1,<3",
  "azure-functions-durable>=1.7.0,<2",
  "azure-identity>=1.25,<2",
  "langgraph>=1.0,<2",
  "openai>=3.46.0,<4",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.3,<3",
  "pytest>=9.1,<10",
  "ruff>=0.15,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
# azure-functions-durable ships no type hints for its decorators.
disallow_untyped_decorators = false
disallow_untyped_calls = false
