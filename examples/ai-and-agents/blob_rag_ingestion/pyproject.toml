[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "blob_rag_ingestion"
version = "0.1.0"
description = "Event-driven RAG ingestion example for Azure Functions: Blob to Azure AI Search."
requires-python = ">=3.11"
dependencies = [
  "azure-functions>=1.22.1,<3",
  "azure-identity>=1.25,<2",
  "azure-search-documents>=12.1.0,<13",
  "openai>=3.46.0,<4",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.3,<3",
  "pytest>=9.1,<10",
  "ruff>=0.15,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
