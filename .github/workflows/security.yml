name: Security Scans

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Hatch and dependencies via Makefile
        run: |
          pip install hatch
          make install

      - name: Run Bandit
        run: make security

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep
        id: semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: p/python

      - name: Record pinned Semgrep action evidence
        if: always()
        env:
          SCANNER_OUTCOME: ${{ steps.semgrep.outcome }}
        run: make security-semgrep

      - name: Upload Semgrep action evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recipe-semgrep-evidence
          path: security-results/**
          if-no-files-found: error

  recipe-security:
    name: Runnable recipe security evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pinned static scanner
        run: python -m pip install bandit==1.9.4
      - name: Check route manifest, Python inventory and deployment structure
        if: always()
        run: make security-static
      - name: Upload redacted runnable recipe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recipe-security-evidence
          path: security-results/**
          if-no-files-found: error

  recipe-dependency-report:
    name: Recipe dependency policy report
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Report root and generated recipe closure policy without blocking unrelated PRs
        run: make security-dependencies-report
      - name: Upload dependency policy report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recipe-dependency-report
          path: security-results/**
          if-no-files-found: error

  paid-ai-host:
    name: Paid AI real host binding check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install local host tooling and test dependencies
        run: |
          npm install --global azure-functions-core-tools@4 azurite
          python -m pip install hatch
          make install
      - name: Inspect real worker metadata and keyless local fallback
        env:
          COOKBOOK_RUN_PAID_AI_HOST: "true"
        run: make security-host
