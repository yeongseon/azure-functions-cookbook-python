name: Test and Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      docs_changed: ${{ steps.classify.outputs.docs_changed }}
      full_required: ${{ steps.classify.outputs.full_required }}
      compat_required: ${{ steps.classify.outputs.compat_required }}
    steps:
      - name: Checkout classification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && github.event.pull_request.base.sha || github.sha }}

      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          SAME_REPOSITORY: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$SAME_REPOSITORY" != "true" ]; then
              git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head" || {
                printf 'docs_only=false\ndocs_changed=true\nfull_required=true\ncompat_required=true\n' >> "$GITHUB_OUTPUT"
                exit 0
              }
            fi
            EVENT_NAME=$EVENT_NAME BASE_SHA=$BASE_SHA HEAD_SHA=$HEAD_SHA \
              tools/ci_classify_workflow.sh
          else
            EVENT_NAME=$EVENT_NAME BEFORE_SHA=$BEFORE_SHA SHA=$SHA \
              tools/ci_classify_workflow.sh
          fi

  # Lint, type-check and workflow hygiene run once on a single pinned
  # interpreter (Python 3.11). These checks are interpreter-agnostic, so
  # fanning them across the matrix would only duplicate work.
  quality:
    name: Lint, type-check & workflow hygiene (Py 3.11)
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Workflow hygiene lint (hatch-matrix)
        run: python tools/lint_hatch_matrix.py

      - name: Workflow hygiene lint (action pins)
        run: python tools/lint_workflow_pins.py

      - name: Check generated recipe requirements
        run: python scripts/gen_requirements.py --check

      - name: Check repeated recipe snippets against their canonical copies
        run: python scripts/gen_recipe_snippets.py --check

      - name: Ruff style check
        run: |
          ruff check src tests
          ruff check --target-version py311 --select I,F,UP,FA examples scripts
          ruff format --check src tests scripts

      - name: Ruff format check (changed Python files)
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/check_pr_format.py "$PR_BASE_SHA" "$PR_HEAD_SHA"

      - name: Type check (mypy)
        run: mypy src tests

      - name: Install Bicep CLI
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x ./bicep
          sudo mv ./bicep /usr/local/bin/bicep
          bicep --version

      - name: Compile every recipe main.bicep (#377)
        run: python tools/compile_bicep_templates.py

  test:
    name: Test (Py ${{ matrix.python-version }}, ${{ matrix.resolution }} deps)
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # Default axis resolves the latest compatible dependencies.
        resolution: ["latest"]
        include:
          # Extra job: resolve to the minimum declared dependency floors on the
          # lowest supported Python, catching breaks at the advertised lower
          # bounds (see constraints-min.txt).
          - python-version: "3.11"
            resolution: "minimum"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }} (${{ matrix.resolution }} deps)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-min.txt

      - name: Assert the runtime interpreter matches the matrix cell
        # Belt-and-braces: tests below run directly on this interpreter (raw
        # pytest, NOT the Python-pinned Hatch env), so 3.11-3.14 are
        # genuinely exercised. This guard fails loudly if that ever drifts.
        env:
          EXPECTED: ${{ matrix.python-version }}
        run: |
          python - <<'PY'
          import os, sys
          expected = tuple(int(p) for p in os.environ["EXPECTED"].split("."))
          actual = sys.version_info[: len(expected)]
          assert actual == expected, f"interpreter {actual} != matrix {expected}"
          print(f"interpreter OK: {sys.version.split()[0]}")
          PY

      - name: Install latest dependencies
        if: matrix.resolution == 'latest'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install minimum dependencies from constraints
        if: matrix.resolution == 'minimum'
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-min.txt -e ".[dev]"

      - name: Assert resolved minimum dependency floors
        if: matrix.resolution == 'minimum'
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          from packaging.version import Version

          for line in Path("constraints-min.txt").read_text().splitlines():
              if not line or line.startswith("#"):
                  continue
              package, expected = line.split("==", maxsplit=1)
              resolved = version(package)
              print(f"{package}: expected={expected} resolved={resolved}")
              assert Version(resolved) == Version(expected)
          PY
          python -m pip check

      # The suite runs as two lanes on the matrix interpreter (raw pytest, NOT the
      # default pinned Hatch env). `repo_infra` marks tests of repository tooling
      # (tools/, scripts/, workflows, Makefile, packaging, generated artifacts);
      # the library lane is everything else. Together they select exactly the
      # tests the previous single `pytest tests/` run did (tests/test_library_infra_split.py
      # asserts that), and both share one coverage data file so the combined
      # 95% gate in the last step is unchanged.
      - name: Library tests (shipped library and recipe behavior)
        run: pytest -m 'not (e2e or smoke or worker_registration or repo_infra)' --cov-fail-under=0 --junitxml=test-results/junit-library.xml tests/

      - name: Library coverage gate (src, 95%)
        run: coverage report --include='src/*' --fail-under=95

      - name: Repository infrastructure tests (tooling, CI contracts, packaging)
        run: pytest -m 'repo_infra and not (e2e or smoke or worker_registration)' --cov-append --cov-fail-under=0 --junitxml=test-results/junit-infra.xml --cov-report=xml --cov-report=term-missing tests/

      - name: Repository tooling coverage gate (tools, 95%)
        run: coverage report --include='tools/*' --fail-under=95

      - name: Combined coverage gate (src and tools, 95%)
        # Same measured sources and threshold as the former single pytest run
        # (pyproject [tool.coverage]); fail_under comes from that config.
        run: coverage report

      - name: Verify coverage output
        run: ls -lh coverage.xml

      # Runs on success and failure (and when pytest itself failed) so a red cell still leaves
      # its JUnit and coverage XML behind. These files hold test ids and line coverage only:
      # no secrets are exposed to the test step and pytest runs without --showlocals.
      - name: Upload JUnit and coverage XML
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-py${{ matrix.python-version }}-${{ matrix.resolution }}
          path: |
            test-results/junit-library.xml
            test-results/junit-infra.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11' && matrix.resolution == 'latest' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          verbose: true
          fail_ci_if_error: false
        env:
          CODECOV_RETRIES: 3

  recipe-tests:
    name: Per-recipe tests (Py 3.11)
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install uv
        run: python -m pip install uv

      - name: Run every discovered recipe test suite
        env:
          RECIPE_TEST_JUNIT_DIR: recipe-test-results
        run: python scripts/run_recipe_tests.py

      # Runs on success and failure so a red suite still leaves its JUnit XML behind. The step
      # above has no secrets and the runner never passes --showlocals.
      - name: Upload recipe JUnit XML
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recipe-test-results
          path: recipe-test-results/*.xml
          if-no-files-found: warn
          retention-days: 14

  artifact-python310-negative:
    name: Wheel install rejection (Py 3.10)
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Set up Python 3.10
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - name: Require rejection by Requires-Python
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          if output=$(python -m pip install --no-deps "$wheel" 2>&1); then
            echo "::error::Python 3.10 unexpectedly installed the candidate wheel"
            exit 1
          fi
          printf '%s\n' "$output"
          grep -F "requires a different Python" <<<"$output"
          grep -F ">=3.11" <<<"$output"

  # Pre-merge toolkit compatibility gate (#427). It runs only for pull requests that touch the
  # integration-sensitive paths listed in tools/ci_classify_compat.sh, tests the PR checkout on a
  # real Functions host against the exact dependency pins in constraints-min.txt, and is
  # aggregated by `ci-required` like every other job. The scheduled and post-release
  # `E2E Toolkit Matrix` (e2e-toolkit.yml) is unchanged and still runs the full latest/main matrix.
  # No secrets, Azure credentials or write permissions are used, so fork PRs run it unchanged.
  toolkit-compat:
    name: Toolkit compatibility (pinned set, Functions host)
    needs: changes
    if: needs.changes.outputs.full_required == 'true' && needs.changes.outputs.compat_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # A skipped or xfailed compatibility test is not evidence (#439).
      PYTEST_ADDOPTS: -p tools.pytest_fail_on_skip
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-min.txt

      - name: Install Functions Core Tools v4
        # The package downloads the CLI from a CDN in its install script; retry transient failures.
        run: |
          for attempt in 1 2 3; do
            npm install --global azure-functions-core-tools@4 --unsafe-perm true && exit 0
            echo "Core Tools install attempt ${attempt} failed" >&2
            sleep 10
          done
          exit 1

      - name: Install the pinned dependency set
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-min.txt -e ".[dev]"
          python -m pip check

      # Host-backed scenarios selected by the `compat` marker: validation, OpenAPI and logging
      # metadata, DB round trip (all through full_stack_crud_api) and LangGraph agent endpoint
      # registration (personal_langgraph_agent). Zero selected tests exits 5; tools/compat_report.py
      # below also enforces a minimum count, no skips and no drift from the pins.
      - name: Run host-backed compatibility tests
        run: >-
          python -m pytest -v -m compat tests/e2e --no-cov
          -p tools.pytest_outcome_json --outcome-json compat-results/outcomes.json

      # Runs on success and failure so a red or empty run still leaves a readable record.
      - name: Summarize compatibility evidence
        if: always()
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python tools/compat_report.py --outcomes compat-results/outcomes.json
          --constraints constraints-min.txt --min-tests 5 --out compat-results

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolkit-compat-evidence
          path: compat-results/
          if-no-files-found: error
          retention-days: 14

  # The single required status check for branch protection.
  #
  # Branch protection matches required checks by literal name, so requiring
  # matrix cells couples it to the matrix: dropping a version removes the job
  # that produced that name, the check is then never reported, and GitHub holds
  # it pending forever -- blocking every PR, Dependabot and Release Please
  # included, until an admin edits settings.
  #
  # This job's name survives matrix changes. `if: always()` guarantees it always
  # reports, and it reads every dependency's result, so a skipped or cancelled
  # job cannot pass by not being a failure.
  host-smoke:
    name: Recipe host smoke (${{ matrix.recipe.name }})
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - name: hello-http
            path: examples/apis-and-ingress/hello_http_minimal
            route: /api/hello
            method: GET
            expect: Hello
          - name: validated-openapi-logging
            path: examples/apis-and-ingress/full_stack_crud_api
            route: /api/items
            method: GET
            expect: '"items"'
          - name: personal-langgraph-agent
            path: examples/ai-and-agents/personal_langgraph_agent
            route: /api/graphs/personal_agent/invoke
            method: POST
            body: '{"input":{"messages":[{"role":"human","content":"What is planned for Project Atlas?"}]},"config":{"configurable":{"thread_id":"host-smoke"}}}'
            expect: "human_turns=1"
          - name: doctor-diagnostics
            path: examples/runtime-and-ops/doctor_diagnostics_endpoint
            route: /api/health
            method: GET
            expect: '"healthy"'
          - name: queue-producer-binding
            path: examples/messaging-and-pubsub/queue_producer
            route: /api/enqueue
            method: POST
            body: '{"task_type":"email","payload":{"to":"user@example.com"}}'
            status: 202
            expect: accepted
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            examples/**/requirements.txt

      - name: Install Functions Core Tools v4 and Azurite
        run: |
          npm install --global azure-functions-core-tools@4 --unsafe-perm true
          npm install --global azurite

      - name: Install recipe dependencies
        working-directory: ${{ matrix.recipe.path }}
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt

      # tools/recipe_host_smoke.py starts Azurite and `func start`, fails on a host that indexes
      # no functions, a worker failure, a timeout or an unexpected response, and writes the
      # evidence record (Core Tools/runtime/Azurite/Python versions, installed toolkit packages,
      # indexed functions, response) that the next step uploads.
      - name: Start recipe host and call its route
        env:
          RECIPE_PATH: ${{ matrix.recipe.path }}
          RECIPE_NAME: ${{ matrix.recipe.name }}
          RECIPE_ROUTE: ${{ matrix.recipe.route }}
          RECIPE_METHOD: ${{ matrix.recipe.method }}
          RECIPE_BODY: ${{ matrix.recipe.body }}
          RECIPE_STATUS: ${{ matrix.recipe.status || 200 }}
          RECIPE_EXPECT: ${{ matrix.recipe.expect }}
        run: |
          args=(--recipe-dir "${RECIPE_PATH}" --route "${RECIPE_ROUTE}" --method "${RECIPE_METHOD}"
                --expect-status "${RECIPE_STATUS}" --expect-body "${RECIPE_EXPECT}"
                --evidence "host-smoke-evidence/${RECIPE_NAME}.json")
          if [ -n "${RECIPE_BODY}" ]; then args+=(--body "${RECIPE_BODY}"); fi
          python tools/recipe_host_smoke.py "${args[@]}"

      - name: Upload host-smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-smoke-${{ matrix.recipe.name }}
          path: host-smoke-evidence/${{ matrix.recipe.name }}.json
          if-no-files-found: error
          retention-days: 14

  docs-check:
    needs: changes
    if: needs.changes.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install docs and drift-check dependencies
        run: pip install -e ".[docs]" pytest pytest-cov pyyaml

      - name: Run documentation-dependent tests
        run: >-
          pytest --no-cov
          tests/test_example_count.py
          tests/test_llms_txt.py
          tests/test_recipe_index.py
          tests/test_recipe_table.py
          tests/test_recipes.py
          tests/test_requirements.py

      - name: Enforce repository language policy
        run: tools/forbid_korean.sh

      - name: Check generated recipe artifacts
        run: |
          python scripts/gen_recipe_index.py --check
          python scripts/gen_recipe_table.py --check
          python scripts/gen_requirements.py --check
          python scripts/gen_recipe_snippets.py --check

      - name: Build documentation strictly
        run: mkdocs build --strict

  ci-required:
    needs:
      - changes
      - quality
      - test
      - recipe-tests
      - artifact-python310-negative
      - host-smoke
      - toolkit-compat
      - docs-check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EVAL'
          import json, os, sys

          matrix_jobs = {
              "quality", "test", "recipe-tests", "artifact-python310-negative", "host-smoke"
          }

          def failures(results):
              changes = results["changes"]
              if changes["result"] != "success":
                  return ["changes"]
              outputs = changes.get("outputs", {})
              if any(outputs.get(name) not in {"true", "false"} for name in (
                  "docs_only", "docs_changed", "full_required", "compat_required"
              )):
                  return ["changes"]
              docs_only = outputs["docs_only"] == "true"
              docs_changed = outputs["docs_changed"] == "true"
              full_required = outputs["full_required"] == "true"
              compat_required = outputs["compat_required"] == "true"
              if docs_only == full_required or docs_only and not docs_changed:
                  return ["changes"]
              if compat_required and not full_required:
                  return ["changes"]
              expected = {job: "success" if full_required else "skipped" for job in matrix_jobs}
              expected["toolkit-compat"] = "success" if compat_required else "skipped"
              expected["docs-check"] = "success" if docs_changed else "skipped"
              expected.update({job: "success" for job in results if job not in set(expected) | {"changes"}})
              return sorted(
                  job for job, wanted in expected.items() if results[job]["result"] != wanted
              )

          def scenario(full_required, docs_changed, overrides=None, changes_result="success", outputs=None, compat=False):
              results = {
                  "changes": {
                      "result": changes_result,
                      "outputs": outputs if outputs is not None else {
                          "docs_only": str(not full_required).lower(),
                          "full_required": str(full_required).lower(),
                          "docs_changed": str(docs_changed).lower(),
                          "compat_required": str(compat).lower(),
                      },
                  },
                  **{job: {"result": "success" if full_required else "skipped"} for job in matrix_jobs},
                  "toolkit-compat": {"result": "success" if compat else "skipped"},
                  "docs-check": {"result": "success" if docs_changed else "skipped"},
              }
              for job, result in (overrides or {}).items():
                  results.setdefault(job, {})
                  results[job]["result"] = result
              return results

          dry_runs = {
              "docs-only+docs ok": (scenario(False, True), []),
              "docs-only+docs-check fail": (scenario(False, True, {"docs-check": "failure"}), ["docs-check"]),
              "code+matrix skipped": (scenario(True, False, {"quality": "skipped"}), ["quality"]),
              "code+test fail": (scenario(True, False, {"test": "failure"}), ["test"]),
              "classifier failure": (scenario(True, True, changes_result="failure"), ["changes"]),
              "cancelled": (scenario(True, False, {"host-smoke": "cancelled"}), ["host-smoke"]),
              "empty outputs": (scenario(True, False, outputs={}), ["changes"]),
              "invalid output": (scenario(True, False, outputs={"docs_only": "false", "docs_changed": "yes", "full_required": "true", "compat_required": "false"}), ["changes"]),
              "impossible no-work outputs": (scenario(False, False, outputs={"docs_only": "false", "docs_changed": "false", "full_required": "false", "compat_required": "false"}), ["changes"]),
              "compat ok": (scenario(True, False, compat=True), []),
              "compat fail": (scenario(True, False, {"toolkit-compat": "failure"}, compat=True), ["toolkit-compat"]),
              "compat skipped when required": (scenario(True, False, {"toolkit-compat": "skipped"}, compat=True), ["toolkit-compat"]),
              "compat cancelled": (scenario(True, False, {"toolkit-compat": "cancelled"}, compat=True), ["toolkit-compat"]),
              "compat ran when not required": (scenario(True, False, {"toolkit-compat": "success"}), ["toolkit-compat"]),
              "compat required without full": (scenario(False, True, compat=True), ["changes"]),
              "missing compat output": (scenario(True, False, outputs={"docs_only": "false", "docs_changed": "false", "full_required": "true"}), ["changes"]),
              "extra failed job": (scenario(True, False, {"future-job": "failure"}), ["future-job"]),
              "extra skipped job": (scenario(True, False, {"future-job": "skipped"}), ["future-job"]),
          }
          for name, (sample, expected) in dry_runs.items():
              actual = failures(sample)
              print(f"dry-run {name}: {'pass' if actual == expected else 'FAIL'}")
              if actual != expected:
                  sys.exit(f"::error::Evaluator dry-run failed for {name}: {actual} != {expected}")

          results = json.loads(os.environ["RESULTS"])
          for job, data in sorted(results.items()):
              print(f"{job}: {data['result']}")
          failed = failures(results)
          if failed:
              sys.exit(f"::error::Required checks violated their expectations: {failed}")
          print("All gating jobs met their expectations.")
          EVAL
