name: Test and Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # Lint, type-check and workflow hygiene run once on a single pinned
  # interpreter (Python 3.11). These checks are interpreter-agnostic, so
  # fanning them across the matrix would only duplicate work.
  quality:
    name: Lint, type-check & workflow hygiene (Py 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Workflow hygiene lint (hatch-matrix)
        run: python tools/lint_hatch_matrix.py

      - name: Workflow hygiene lint (action pins)
        run: python tools/lint_workflow_pins.py

      - name: Check generated recipe requirements
        run: python scripts/gen_requirements.py --check

      - name: Ruff style check
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Ruff format check (changed Python files)
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/check_pr_format.py "$PR_BASE_SHA" "$PR_HEAD_SHA"

      - name: Type check (mypy)
        run: mypy src tests

  test:
    name: Test (Py ${{ matrix.python-version }}, ${{ matrix.resolution }} deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # Default axis resolves the latest compatible dependencies.
        resolution: ["latest"]
        include:
          # Extra job: resolve to the minimum declared dependency floors on the
          # lowest supported Python, catching breaks at the advertised lower
          # bounds (see constraints-min.txt).
          - python-version: "3.11"
            resolution: "minimum"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }} (${{ matrix.resolution }} deps)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Assert the runtime interpreter matches the matrix cell
        # Belt-and-braces: tests below run directly on this interpreter (raw
        # pytest, NOT the Python-pinned Hatch env), so 3.11-3.14 are
        # genuinely exercised. This guard fails loudly if that ever drifts.
        env:
          EXPECTED: ${{ matrix.python-version }}
        run: |
          python - <<'PY'
          import os, sys
          expected = tuple(int(p) for p in os.environ["EXPECTED"].split("."))
          actual = sys.version_info[: len(expected)]
          assert actual == expected, f"interpreter {actual} != matrix {expected}"
          print(f"interpreter OK: {sys.version.split()[0]}")
          PY

      - name: Install package with dev extras (on the matrix interpreter)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Downgrade to minimum dependency floors
        if: matrix.resolution == 'minimum'
        run: python -m pip install -c constraints-min.txt -e ".[dev]"

      - name: Run tests on the matrix interpreter
        # Raw pytest on the interpreter provisioned above (NOT through the
        # default pinned Hatch env). The repo pytest config enables --cov
        # with fail_under=95.
        run: pytest --cov-report=xml --cov-report=term-missing --cov=src/azure_functions_python_cookbook tests/

      - name: Verify coverage output
        run: ls -lh coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11' && matrix.resolution == 'latest' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          verbose: true
          fail_ci_if_error: false
        env:
          CODECOV_RETRIES: 3

  recipe-tests:
    name: Per-recipe tests (Py 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Run every discovered recipe test suite
        run: python scripts/run_recipe_tests.py

  artifact-python310-negative:
    name: Wheel install rejection (Py 3.10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Require rejection by Requires-Python
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          if output=$(python -m pip install --no-deps "$wheel" 2>&1); then
            echo "::error::Python 3.10 unexpectedly installed the candidate wheel"
            exit 1
          fi
          printf '%s\n' "$output"
          grep -F "requires a different Python" <<<"$output"
          grep -F ">=3.11" <<<"$output"

  # The single required status check for branch protection.
  #
  # Branch protection matches required checks by literal name, so requiring
  # matrix cells couples it to the matrix: dropping a version removes the job
  # that produced that name, the check is then never reported, and GitHub holds
  # it pending forever -- blocking every PR, Dependabot and Release Please
  # included, until an admin edits settings.
  #
  # This job's name survives matrix changes. `if: always()` guarantees it always
  # reports, and it reads every dependency's result, so a skipped or cancelled
  # job cannot pass by not being a failure.
  host-smoke:
    name: Recipe host smoke (${{ matrix.recipe.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - name: hello-http
            path: examples/apis-and-ingress/hello_http_minimal
            url: http://127.0.0.1:7071/api/hello
          - name: validated-openapi-logging
            path: examples/apis-and-ingress/full_stack_crud_api
            url: http://127.0.0.1:7071/api/items
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Functions Core Tools v4 and Azurite
        run: |
          npm install --global azure-functions-core-tools@4 --unsafe-perm true
          npm install --global azurite

      - name: Install recipe dependencies
        working-directory: ${{ matrix.recipe.path }}
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt

      - name: Start recipe host and call its public route
        working-directory: ${{ matrix.recipe.path }}
        env:
          RECIPE_URL: ${{ matrix.recipe.url }}
        run: |
          azurite --silent > "${RUNNER_TEMP}/azurite.log" 2>&1 &
          PATH="$PWD/.venv/bin:$PATH" func start --python --port 7071 > "${RUNNER_TEMP}/func-host.log" 2>&1 &
          host_pid=$!
          trap 'cat "${RUNNER_TEMP}/func-host.log"; kill "${host_pid}" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if grep -Eq "Generating 0 job function|Worker failed|Host startup operation has been canceled" "${RUNNER_TEMP}/func-host.log"; then
              exit 1
            fi
            if curl --fail --silent "${RECIPE_URL}" > "${RUNNER_TEMP}/response.out"; then
              exit 0
            fi
            sleep 2
          done
          exit 1

  ci-required:
    needs: [quality, test, recipe-tests, artifact-python310-negative, host-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EVAL'
          import json, os, sys

          results = json.loads(os.environ["RESULTS"])
          for job, data in sorted(results.items()):
              print(f"{job}: {data['result']}")
          failed = sorted(j for j, d in results.items() if d["result"] != "success")
          if failed:
              sys.exit(f"::error::Required checks did not all succeed: {failed}")
          print("All gating jobs succeeded.")
          EVAL
