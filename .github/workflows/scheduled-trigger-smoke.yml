name: Scheduled trigger smoke

on:
  schedule:
    - cron: "0 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-trigger-smoke
  cancel-in-progress: false

jobs:
  queue-blob-durable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Functions Core Tools, Azurite, and dependencies
        run: |
          npm install --global azure-functions-core-tools@4 --unsafe-perm true
          npm install --global azurite
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run owned local host, queue, blob and durable import suites
        run: make integration

      - name: Verify all three suites actually selected tests
        run: python tools/verify_scheduled_smoke_selection.py

      - name: Upload scheduled local evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scheduled-trigger-evidence
          path: test-results/**

  worker-registration-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run deterministic Python worker registration guard (#379)
        run: make worker-registration

      - name: Upload worker registration evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-registration-evidence
          path: test-results/**
