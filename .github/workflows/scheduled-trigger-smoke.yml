name: Scheduled trigger smoke

on:
  schedule:
    - cron: "0 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-trigger-smoke
  cancel-in-progress: false

jobs:
  queue-blob-durable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Functions Core Tools, Azurite, and dependencies
        run: |
          npm install --global azure-functions-core-tools@4 --unsafe-perm true
          npm install --global azurite
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run queue and blob e2e suites
        run: >-
          python -m pytest -v -m e2e --no-cov
          tests/e2e/test_queue_examples.py
          tests/e2e/test_blob_examples.py

      - name: Run durable import-only smoke suite
        run: >-
          python -m pytest -v -m smoke --no-cov
          tests/e2e/test_durable_examples.py

      - name: Verify all three suites actually selected tests
        run: python tools/verify_scheduled_smoke_selection.py

  worker-registration-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # A skipped or xfailed test is not evidence that handlers register (#437).
      PYTEST_ADDOPTS: -p tools.pytest_fail_on_skip
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The extra pins are the pinned worker's runtime dependencies for Python
      # <= 3.13 (workers/pyproject.toml at WORKER_SHA in
      # tests/test_worker_registration_guard.py). Re-check them whenever WORKER_SHA
      # moves; the guard fails, never skips, when one is missing.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" \
            "grpcio~=1.70.0" "protobuf~=5.29.0" "python-dateutil~=2.9.0"

      - name: Run deterministic Python worker registration guard (#379)
        run: python -m pytest -v -m worker_registration --no-cov tests/test_worker_registration_guard.py
