name: Recipe release security

on:
  workflow_call:

permissions:
  contents: read

jobs:
  dependency-policy:
    name: Resolved runtime dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Block unexcepted advisories and incomplete audits
        run: make security-dependencies
      - name: Upload redacted dependency evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-recipe-dependency-evidence
          path: security-results/**
          if-no-files-found: error
