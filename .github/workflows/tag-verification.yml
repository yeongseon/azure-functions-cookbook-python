name: Tag verification

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify artifact metadata and clean Python 3.11 install
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              metadata_name = next(name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))
              metadata = archive.read(metadata_name).decode()
          assert "Requires-Python: >=3.11,<3.15" in metadata
          PY
          python -m venv /tmp/cookbook-install
          /tmp/cookbook-install/bin/python -m pip install dist/*.whl
          /tmp/cookbook-install/bin/python -m pip check

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Require Python 3.10 rejection
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          if python -m pip install --no-deps "$wheel"; then
            echo "::error::Python 3.10 unexpectedly installed the release wheel"
            exit 1
          fi
